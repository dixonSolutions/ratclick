name: release

# Pushing to main cuts a release *only* when the workspace version has changed:
# the version job refuses to release over an existing v<version> tag. Ordinary
# commits still run the full test job, they just skip the packaging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two releases racing each other would both rewrite gh-pages and one would lose
# its packages, so serialise the whole workflow.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the workspace version and look for its tag
        id: v
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          version="$(scripts/version.sh)"
          tag="v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=No release::$tag already exists — bump the version in Cargo.toml to cut a new release."
          else
            echo "should_release=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Releasing::$tag does not exist yet — this push will be released."
          fi

  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libadwaita-1-dev libgtk-4-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  build-deb:
    name: build .deb
    needs: [version, test]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libadwaita-1-dev libgtk-4-dev libudev-dev scdoc

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build the package
        run: scripts/build-packages.sh --deb-only

      - name: Show what is in it
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-rpm:
    name: build .rpm
    needs: [version, test]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # In a Fedora container so the binaries are linked and checked against
    # Fedora's libraries rather than Ubuntu's.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install \
            gcc pkgconf-pkg-config \
            libadwaita-devel gtk4-devel systemd-devel \
            cargo rust rust-std-static \
            scdoc rpm-build rpm-sign git-core findutils gnupg2 tar

      - uses: actions/checkout@v4

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build the package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-packages.sh --rpm-only

      - name: Sign the package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error title=Missing secret::GPG_PRIVATE_KEY is not set; the dnf repo needs signed packages for gpgcheck=1."
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          export GPG_KEY_ID
          scripts/sign-rpm.sh dist/*.rpm

      - name: Show what is in it
        run: |
          rpm -qip dist/*.rpm
          rpm -qlvp dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: tag and release
    needs: [version, build-deb, build-rpm]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.deb' -o -name '*.rpm' \) -exec mv {} dist/ \;
          ls -l dist

      - name: Pack the GNOME Shell extension
        run: |
          set -euo pipefail
          sudo apt-get update
          # `gnome-extensions` ships inside gnome-shell. It is the only thing
          # that produces a zip extensions.gnome.org will accept, so it is worth
          # the install.
          sudo apt-get install -y --no-install-recommends gnome-shell
          scripts/pack-extension.sh dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Create the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "RatClick $VERSION"
          git push origin "$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat >"$notes" <<EOF
          ## Install

          Debian / Ubuntu, from the apt repository:

          \`\`\`bash
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL -o /tmp/ratclick.asc https://dixonsolutions.github.io/ratclick/ratclick.asc \\
            && grep -q 'BEGIN PGP PUBLIC KEY' /tmp/ratclick.asc \\
            && sudo install -m 0644 /tmp/ratclick.asc /etc/apt/keyrings/ratclick.asc \\
            && echo "deb [signed-by=/etc/apt/keyrings/ratclick.asc] https://dixonsolutions.github.io/ratclick/apt stable main" \\
               | sudo tee /etc/apt/sources.list.d/ratclick.list >/dev/null \\
            && sudo apt update \\
            && sudo apt install ratclick
          \`\`\`

          Fedora, from the dnf repository:

          \`\`\`bash
          sudo curl -fsSL -o /etc/yum.repos.d/ratclick.repo https://dixonsolutions.github.io/ratclick/ratclick.repo
          sudo rpm --import https://dixonsolutions.github.io/ratclick/ratclick.asc
          sudo dnf install ratclick
          \`\`\`

          Or download the \`.deb\` / \`.rpm\` below. \`SHA256SUMS\` covers every
          attached file. Full instructions: [docs/install.md](https://github.com/dixonSolutions/ratclick/blob/$TAG/docs/install.md)
          EOF
          gh release create "$TAG" \
            --title "RatClick $VERSION" \
            --notes-file "$notes" \
            dist/*

  # ---------------------------------------------------------------------------
  repo:
    name: apt + dnf repositories
    needs: [version, release]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c gnupg

      - name: Fetch what is already published
        # First release has no gh-pages branch yet; that is not an error.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Prepare the site directory
        run: |
          set -euo pipefail
          mkdir -p site
          # The checkout above leaves a .git in site/; the deploy step makes its
          # own, and shipping this one to Pages would be a mistake.
          rm -rf site/.git
          echo "existing content:"
          find site -maxdepth 2 -mindepth 1 | sort | sed 's/^/    /' || true

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.deb' -o -name '*.rpm' \) -exec mv {} dist/ \;
          ls -l dist

      - name: Rebuild the repositories
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SITE_URL: https://dixonsolutions.github.io/ratclick
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error title=Missing secret::GPG_PRIVATE_KEY is not set; the repositories cannot be signed."
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          export GPG_KEY_ID
          echo "signing with $GPG_KEY_ID"
          scripts/build-pages.sh site dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # The site directory was seeded from the branch, so it is already the
          # full desired state; anything still on the branch is stale.
          force_orphan: false
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish RatClick ${{ needs.version.outputs.version }}"
